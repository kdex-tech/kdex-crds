    controller-gen.kubebuilder.io/version: v0.20.1
  name: kdexhostextensions.kdex.dev
spec:
  group: kdex.dev
  names:
    categories:
    - all
    - kdex
    kind: KDexHostExtension
    listKind: KDexHostExtensionList
    plural: kdexhostextensions
    shortNames:
    - kdex-hx
    singular: kdexhostextension
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hostRef.name
      name: Host
      type: string
    - jsonPath: .spec.weight
      name: Weight
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Attached")].status
      name: Attached
      type: string
    - jsonPath: .metadata.generation
      name: Gen
      priority: 1
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KDexHostExtension is the Schema for the kdexhostextensions API

          A KDexHostExtension carries contributions a companion chart makes to a
          KDexHost it does not own: claimMappings and anonymousEntitlements. It
          applies only when it names the host in spec.hostRef AND its labels match the
          host's spec.extensionSelector; a host without a selector accepts none.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of KDexHostExtension
            properties:
              anonymousEntitlements:
                description: anonymousEntitlements are unioned into the host's anonymousEntitlements.
                items:
                  maxLength: 256
                  type: string
                maxItems: 64
                type: array
              claimMappings:
                description: |-
                  claimMappings are appended after the host's own claimMappings. List
                  targets accumulate, so a rule adds to what the host already maps.
                items:
                  description: |-
                    MappingRule defines a transformation rule for mapping arbitrary data from an
                    input to an output.
                  properties:
                    merge:
                      description: |-
                        merge controls how the rule's result combines with a value already at
                        targetPropPath. Accumulate (the default when empty): when both the
                        existing value and the result are lists, the result is the existing list
                        followed by the result's items not already present (order-preserving
                        set-union), so restating self.<target> is harmless and idempotent.
                        Values already at that path in the input — including claims asserted by
                        an identity provider — therefore stay in the output. Any other shape
                        pair (scalar, map, list vs non-list) replaces. Replace: the result
                        always replaces. Use it for any rule meant to filter, transform,
                        normalise or override a list already at its own target (e.g. a rule
                        that reads self.groups and writes groups).
                      enum:
                      - Accumulate
                      - Replace
                      type: string
                    required:
                      default: false
                      description: |-
                        required indicates that if the rule fails to produce a value the rule
                        will be skipped. Otherwise the execution should fail.
                      type: boolean
                    sourceExpression:
                      description: |-
                        sourceExpression is CEL program to compute a transformation of input into
                        a new form.
                      example: self.oidc.groups.filter(g, g.startsWith('app_')).join(',')
                      minLength: 2
                      type: string
                    targetPropPath:
                      description: |-
                        targetPropPath is a dot-separated property path for where the result
                        should be attached in the output.
                      example: auth.internal_groups
                      minLength: 2
                      type: string
                  required:
                  - sourceExpression
                  - targetPropPath
                  type: object
                maxItems: 16
                type: array
              hostRef:
                description: |-
                  hostRef names the KDexHost in the same namespace this extension
                  contributes to. The host must also select this extension through its
                  spec.extensionSelector.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: hostRef.name must not be empty
                  rule: self.name.size() > 0
              weight:
                default: 0
                description: |-
                  weight orders this extension among the extensions a host applies: lower
                  runs first, ties by name. The host's own claimMappings always run before
                  every extension's.
                format: int32
                maximum: 1000
                minimum: -1000
                type: integer
            required:
            - hostRef
            type: object
          status:
            description: status defines the observed state of KDexHostExtension
            properties:
              attributes:
                additionalProperties:
                  type: string
                description: attributes hold state of the resource as key/value pairs.
                maxProperties: 64
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Progressing": the resource is being created or updated
                  - "Ready": the resource is fully functional
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  observedGeneration is the most recent generation observed for this resource. It corresponds to the
                  resource's generation, which is updated on mutation by the API Server.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
